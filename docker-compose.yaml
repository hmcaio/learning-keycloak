services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.6
    ports:
      - "9000:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - keycloak_data:/opt/keycloak/data
    command:
      - "start-dev"
    networks:
      - backend

  oauth2-resource-server:
    image: oauth2-resource-server:0.0.1-SNAPSHOT
    ports:
      - "8080:8080"
    depends_on:
      - keycloak
    networks:
      - backend

volumes:
  keycloak_data:

networks:
  backend: