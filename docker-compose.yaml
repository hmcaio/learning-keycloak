services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.6
    ports:
      - "9000:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - keycloak_data:/opt/keycloak/data
    command:
      - "start-dev"

volumes:
  keycloak_data:
